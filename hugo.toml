baseURL = "https://donghyunj.github.io/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "정동현 | Backend Developer"
theme = "PaperMod"

[params]
  defaultTheme = "dark"        # 다크 기본 (우측 상단 토글로 라이트 전환 가능)
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowShareButtons = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true   # 코드 블록 복사 버튼
  ShowToc = true               # 목차 (노션 느낌)
  TocOpen = false

  [params.label]
    text = "정동현"            # 헤더 로고 텍스트 (짧게)

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/DongHyunj"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:deatytim@gmail.com"

